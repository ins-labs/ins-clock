name: Deploy Cloudflare trigger
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-cloudflare-trigger
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 428e781a7f0a318bb08a14152d0a668e
          workingDirectory: trigger
          command: deploy --keep-vars
