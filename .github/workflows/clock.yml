name: clock
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
concurrency:
  group: clock
  cancel-in-progress: false
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: tick
        env:
          PAT: ${{ secrets.CLOCK_PAT }}
          REPO: ${{ github.repository }}
          HC_URL: ${{ secrets.HC_PING_URL }}
          D1_TOKEN: ${{ secrets.CLOCK_D1_TOKEN }}
        run: |
          python3 -u - <<'PY'
          import os, re, json, base64, calendar, urllib.request, urllib.error, datetime as dt
          from zoneinfo import ZoneInfo

          PAT = os.environ["PAT"]
          REPO = os.environ["REPO"]
          TASKS = "ins-labs/ins-clock-tasks"
          ASSIGNEE = "ins-sherbeeny"
          HC = os.environ.get("HC_URL", "")
          ok = True
          CAI = ZoneInfo("Africa/Cairo")
          UTC = dt.timezone.utc
          NAME = re.compile(r"^T(\d{8})_(\d{4})__(ONCE|P(\d+)(MI|H|D|W|MO)(L?))__([0-9]{6}_[A-Z0-9]+|[A-Z0-9]+)(?:__U(\d{8}))?$")


          def api(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(
                  "https://api.github.com" + path, method=method, data=data,
                  headers={"Authorization": "Bearer " + PAT, "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      t = r.read()
                      return r.status, (json.loads(t) if t else None)
              except urllib.error.HTTPError as e:
                  return e.code, None


          def add_months(t, n):
              m = t.month - 1 + n
              y = t.year + m // 12
              m = m % 12 + 1
              d = min(t.day, calendar.monthrange(y, m)[1])
              return t.replace(year=y, month=m, day=d)


          def advance(due, n, unit, local):
              t = due.astimezone(CAI).replace(tzinfo=None) if local else due
              if unit == "MO":
                  t = add_months(t, n)
              else:
                  t = t + {"MI": dt.timedelta(minutes=n), "H": dt.timedelta(hours=n),
                           "D": dt.timedelta(days=n), "W": dt.timedelta(weeks=n)}[unit]
              if local:
                  t = t.replace(tzinfo=CAI).astimezone(UTC)
              return t


          def fmt(t):
              return "T%s_%s" % (t.strftime("%Y%m%d"), t.strftime("%H%M"))


          now = dt.datetime.now(UTC)
          variables, page = [], 1
          while True:
              st, d = api("GET", "/repos/%s/actions/variables?per_page=30&page=%d" % (REPO, page))
              if st != 200:
                  print("list failed", st)
                  raise SystemExit(1)
              variables += d["variables"]
              if len(variables) >= d["total_count"] or not d["variables"]:
                  break
              page += 1

          due, skipped = [], 0
          for v in variables:
              m = NAME.match(v["name"])
              if not m:
                  skipped += 1
                  continue
              t = dt.datetime.strptime(m.group(1) + m.group(2), "%Y%m%d%H%M").replace(tzinfo=UTC)
              if t <= now:
                  due.append((t, v, m))
          print("variables=%d due=%d unparsed=%d" % (len(variables), len(due), skipped))

          if due:
              seen, page = set(), 1
              while True:
                  st, iss = api("GET", "/repos/%s/issues?state=all&per_page=100&page=%d" % (TASKS, page))
                  if st != 200:
                      print("issue list failed", st)
                      raise SystemExit(1)
                  seen.update(i["title"] for i in iss)
                  if len(iss) < 100:
                      break
                  page += 1
              for t, v, m in sorted(due, key=lambda x: x[0]):
                  name = v["name"]
                  nxt = None
                  if m.group(3) != "ONCE":
                      n, unit, local = int(m.group(4)), m.group(5), m.group(6) == "L"
                      nxt = advance(t, n, unit, local)
                      while nxt <= now:
                          nxt = advance(nxt, n, unit, local)
                      if m.group(8) and nxt.strftime("%Y%m%d") > m.group(8):
                          nxt = None
                  footer = "\n\n---\nclock: due %s UTC; next %s" % (
                      t.strftime("%Y-%m-%d %H:%M"), nxt.strftime("%Y-%m-%d %H:%M UTC") if nxt else "none (retired)")
                  if name not in seen:
                      st, _ = api("POST", "/repos/%s/issues" % TASKS,
                                  {"title": name, "body": v["value"] + footer, "assignees": [ASSIGNEE]})
                      if st != 201:
                          print("issue create failed", st)
                          ok = False
                          continue
                  if nxt:
                      rec = m.group(3)
                      newname = "%s__%s__%s" % (fmt(nxt), rec, m.group(7)) + ("__U" + m.group(8) if m.group(8) else "")
                      st, _ = api("PATCH", "/repos/%s/actions/variables/%s" % (REPO, name), {"name": newname})
                      print("advanced", st)
                      ok = ok and st == 200
                  else:
                      st, _ = api("DELETE", "/repos/%s/actions/variables/%s" % (REPO, name))
                      print("retired", st)
                      ok = ok and st == 204

          if now.hour == 3 and now.minute < 10:
              path = "/repos/%s/contents/heartbeat.txt" % REPO
              today = now.strftime("%Y-%m-%d") + "\n"
              st, cur = api("GET", path)
              same = st == 200 and base64.b64decode(cur["content"]).decode() == today
              if not same:
                  body = {"message": "heartbeat", "content": base64.b64encode(today.encode()).decode()}
                  if st == 200:
                      body["sha"] = cur["sha"]
                  st, _ = api("PUT", path, body)
                  print("heartbeat", st)

          if not ok:
              raise SystemExit(1)

          # Reconcile live variables to D1, then regenerate the private recovery backup.
          # A failed write is retried on the next tick, including if no obligation is due.
          D1_URL = "https://api.cloudflare.com/client/v4/accounts/428e781a7f0a318bb08a14152d0a668e/d1/database/169c9e20-d1bd-4b39-9ac2-cb63610d7745/query"
          def d1(sql, params=None):
              req = urllib.request.Request(D1_URL, data=json.dumps({"sql": sql, "params": params or []}).encode(),
                  headers={"Authorization": "Bearer " + os.environ["D1_TOKEN"], "Content-Type": "application/json"})
              result = json.load(urllib.request.urlopen(req, timeout=30))
              if not result.get("success") or any(not x.get("success") for x in result["result"]):
                  raise RuntimeError("D1 query failed")
              return result["result"][0].get("results", [])
          try:
              rows = d1("SELECT * FROM clock_obligations ORDER BY serial")
              current, page = {}, 1
              while True:
                  st, data = api("GET", "/repos/%s/actions/variables?per_page=30&page=%d" % (REPO, page))
                  if st != 200:
                      raise RuntimeError("variable reload failed")
                  for v in data["variables"]:
                      m = NAME.match(v["name"])
                      if m and "_" in m.group(7):
                          serial, code = m.group(7).split("_", 1)
                          if serial in current:
                              raise RuntimeError("duplicate serial")
                          current[serial] = (v, m, code)
                  if page * 30 >= data["total_count"]:
                      break
                  page += 1
              if set(current) - {r["id"] for r in rows}:
                  raise RuntimeError("unregistered serial")
              changed_at = now.isoformat().replace("+00:00", "Z")
              for r in rows:
                  if r["id"] in current:
                      v, m, code = current[r["id"]]
                      if r["status"] == "cancelled":
                          raise RuntimeError("cancelled variable still present")
                      due_at = dt.datetime.strptime(m.group(1)+m.group(2), "%Y%m%d%H%M").isoformat()+"Z"
                      values = [code, v["value"], "active", v["name"], due_at, m.group(3), m.group(8)]
                  elif r["status"] == "active":
                      values = [r["code"], r["details"], "retired", None, None, r["recurrence"], r["until_date"]]
                  else:
                      continue
                  keys = ["code", "details", "status", "variable_name", "due_at", "recurrence", "until_date"]
                  if values != [r[k] for k in keys]:
                      d1("UPDATE clock_obligations SET code=?,details=?,status=?,variable_name=?,due_at=?,recurrence=?,until_date=?,updated_at=? WHERE id=?", values+[changed_at,r["id"]])
              rows = d1("SELECT * FROM clock_obligations ORDER BY serial")
              obligations = []
              for r in rows:
                  r["references"] = json.loads(r.pop("references_json"))
                  obligations.append(r)
              path = "/repos/%s/contents/registry.json" % TASKS
              st, old = api("GET", path)
              if st not in (200,404):
                  raise RuntimeError("backup read failed")
              prior = json.loads(base64.b64decode(old["content"])) if st == 200 else {}
              if prior.get("obligations") != obligations:
                  export = {"schema_version":1,"generated_at":changed_at,"obligations":obligations}
                  payload = {"message":"Update obligation registry backup", "content":base64.b64encode(json.dumps(export,ensure_ascii=False,indent=2).encode()).decode()}
                  if st == 200:
                      payload["sha"] = old["sha"]
                  st, _ = api("PUT",path,payload)
                  if st not in (200,201):
                      raise RuntimeError("backup write failed")
                  print("registry backup updated")
              print("registry verified")
          except Exception:
              print("registry sync failed")
              raise SystemExit(1)

          # hourly dead-man ping: once per UTC hour, only after a fully successful run
          hour = now.strftime("%Y%m%d%H")
          last = next((v for v in variables if v["name"] == "LASTPING"), None)
          if (last["value"] if last else "") != hour and HC:
              try:
                  urllib.request.urlopen(urllib.request.Request(HC, method="GET"), timeout=20).read()
                  if last:
                      api("PATCH", "/repos/%s/actions/variables/LASTPING" % REPO, {"name": "LASTPING", "value": hour})
                  else:
                      api("POST", "/repos/%s/actions/variables" % REPO, {"name": "LASTPING", "value": hour})
                  print("pinged")
              except Exception:
                  print("ping failed")
          PY
      - name: report failure
        if: failure()
        env:
          HC_URL: ${{ secrets.HC_PING_URL }}
        run: curl -fsS -m 20 "$HC_URL/fail" >/dev/null || true
